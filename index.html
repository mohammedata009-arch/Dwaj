<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إختبار المحاضرة الرابعة - م. محمد طه</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --navy: #0c1a30; --gold: #b08d41; --white: #ffffff; --success: #27ae60; --danger: #c0392b; --whatsapp: #25d366; }
        body { font-family: 'Tajawal', sans-serif; background-color: #1a1a1a; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .quiz-container { background: var(--white); width: 100%; max-width: 750px; border-radius: 20px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border-top: 10px solid var(--gold); }
        .quiz-header { background: var(--navy); color: white; padding: 30px; text-align: center; }
        .quiz-header h1 { font-family: 'Cairo'; margin: 0; font-size: 24px; color: var(--gold); }
        .progress-bar { height: 8px; background: #eee; width: 100%; }
        #progress-fill { height: 100%; background: var(--gold); width: 0%; transition: 0.4s; }
        .question-box { padding: 40px; }
        .question-text { font-size: 22px; font-weight: bold; color: var(--navy); margin-bottom: 25px; line-height: 1.5; min-height: 60px; }
        .options-grid { display: grid; gap: 12px; }
        .option-btn { background: #f8fafc; border: 2px solid #e2e8f0; padding: 18px; border-radius: 12px; cursor: pointer; text-align: right; font-size: 18px; font-weight: bold; transition: 0.2s; color: var(--navy); }
        .option-btn:hover:not(:disabled) { border-color: var(--gold); background: #fdfae7; }
        .correct { background: var(--success) !important; color: white !important; border-color: var(--success) !important; }
        .wrong { background: var(--danger) !important; color: white !important; border-color: var(--danger) !important; }
        #feedback-box { margin-top: 20px; padding: 15px; border-radius: 10px; display: none; font-weight: bold; animation: fadeIn 0.4s; }
        #result-screen { display: none; padding: 40px; text-align: center; }
        .score-circle { width: 140px; height: 140px; border-radius: 50%; border: 8px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 900; margin: 0 auto 20px; color: var(--navy); }
        .btn-action { background: var(--gold); color: white; border: none; padding: 12px 25px; border-radius: 50px; font-size: 16px; font-weight: bold; cursor: pointer; margin: 5px; font-family: 'Cairo'; display: inline-flex; align-items: center; gap: 8px; }
        .btn-whatsapp { background: var(--whatsapp); }
        .fee-notice { background: #fff3cd; color: #856404; padding: 10px; border-radius: 8px; margin: 15px 0; font-weight: bold; font-size: 14px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @media print { .btn-action, .option-btn, .quiz-header, .progress-bar, .fee-notice { display: none !important; } #result-screen { display: block !important; } }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-ui">
        <div class="quiz-header">
            <h1>إختبار المحاضرة الرابعة: الدرع الواقي</h1>
            <p>يا متدربين، نرجو كتابة الاسم قبل البدء</p>
            <input type="text" id="user-name" placeholder="أدخل اسمك الثلاثي هنا" style="width: 80%; padding: 10px; border-radius: 5px; border: none; margin-top: 10px; text-align: center; font-family: 'Tajawal';">
        </div>
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <div class="question-box">
            <div id="q-text" class="question-text">يرجى إدخال اسمك للبدء..</div>
            <div id="options-box" class="options-grid"></div>
            <div id="feedback-box"></div>
            <div style="margin-top: 20px; text-align: left; font-weight: bold; color: var(--gold);" id="counter">1 / 10</div>
            <button id="start-btn" class="btn-action" style="width: 100%; margin-top: 20px;" onclick="startQuiz()">ابدأ الاختبار الآن</button>
        </div>
    </div>

    <div id="result-screen">
        <h2 id="congrats-msg">أحسنتم يا متدربين!</h2>
        <div class="score-circle" id="final-score">0</div>
        <p id="evaluation-text" style="font-weight: bold;"></p>
        <div class="fee-notice">رسوم استخراج الشهادة المعتمدة: 7,000 جنيه فقط</div>
        
        <button class="btn-action btn-whatsapp" onclick="sendWhatsApp()">
            <i class="fab fa-whatsapp"></i> إرسال النتيجة وطلب شهادة
        </button>
        <button class="btn-action" onclick="window.print()">
            <i class="fas fa-print"></i> طباعة
        </button>
        <button class="btn-action" style="background: var(--navy);" onclick="location.reload()">إعادة</button>
    </div>
</div>

<audio id="sound-correct" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
<audio id="sound-wrong" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>

<script>
    const questions = [
        { q: "يا متدربين، ما هو الإجراء الأهم عند مدخل العنبر؟", a: ["غسل الحذاء بالماء", "استخدام حوض التطهير (اليود)", "المسح بقطعة قماش"], c: 1, exp: "حوض التطهير هو صمام الأمان الأول." },
        { q: "لماذا نضيف 'اللبن البودرة' لمياه التحصين؟", a: ["لزيادة الوزن", "لحماية الفيروس من الكلور والشوائب", "لجعل الماء حلواً"], c: 1, exp: "اللبن يحمي الفيروس (اللقاح) ليصل نشطاً." },
        { q: "كم جرعة اللبن البودرة لكل لتر ماء؟", a: ["10 جرام", "2 جرام", "5 جرام"], c: 1, exp: "2 جرام كافية تماماً." },
        { q: "أفضل توقيت للتحصين في مياه الشرب؟", a: ["الظهيرة", "الصباح الباكر (وقت البراد)", "المساء المتأخر"], c: 1, exp: "الحرارة تقتل الفيروس، لذا الصباح هو الأفضل." },
        { q: "فائدة التعطيش قبل التحصين يا متدربين؟", a: ["توفير الماء", "ضمان استهلاك اللقاح بسرعة", "تحسين الهضم"], c: 1, exp: "التعطيش يضمن شرب اللقاح في أقل من ساعتين." },
        { q: "عمر تحصين الجمبورو المعتاد؟", a: ["عمر يوم", "عمر 14 يوماً", "عمر 25 يوماً"], c: 1, exp: "يوم 14 هو الموعد السيادي للجمبورو." },
        { q: "ماذا نفعل بعد التحصين بيومين؟", a: ["إعطاء مضاد حيوي", "إعطاء رافع مناعة وفيتامينات", "منع العلف"], c: 1, exp: "رافع المناعة يساعد في الاستجابة للقاح." },
        { q: "كيف نتخلص من الطيور النافقة؟", a: ["رميها بالخارج", "الحرق أو الدفن بعيداً", "تركها بالعنبر"], c: 1, exp: "النافق مصدر عدوى ويجب دفنه أو حرقه." },
        { q: "وظيفة السلك الضيق على النوافذ؟", a: ["منع الهواء", "منع العصافير الناقلة للأمراض", "الديكور"], c: 1, exp: "الطيور البرية تنقل الأوبئة الفتاكة." },
        { q: "أهم ركيزة في الأمن الحيوي؟", a: ["كثرة العمال", "منع الزيارات والأشخاص الغرباء", "تلوين الجدران"], c: 1, exp: "الزيارات هي المصدر الأول لدخول الفيروسات." }
    ];

    let currentIdx = 0; let score = 0; let userName = "";

    function startQuiz() {
        userName = document.getElementById('user-name').value;
        if (!userName) { alert("لطفاً، أدخل اسمك للبدء"); return; }
        document.getElementById('start-btn').style.display = 'none';
        document.getElementById('user-name').disabled = true;
        loadQuestion();
    }

    function loadQuestion() {
        if (currentIdx >= questions.length) { showFinal(); return; }
        const qData = questions[currentIdx];
        document.getElementById('q-text').innerText = qData.q;
        document.getElementById('counter').innerText = `${currentIdx + 1} / ${questions.length}`;
        document.getElementById('progress-fill').style.width = ((currentIdx + 1) / questions.length * 100) + "%";
        document.getElementById('feedback-box').style.display = 'none';
        const box = document.getElementById('options-box');
        box.innerHTML = '';
        qData.a.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => validate(i, btn);
            box.appendChild(btn);
        });
    }

    function validate(idx, btn) {
        const correct = questions[currentIdx].c;
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);
        const fb = document.getElementById('feedback-box');
        fb.innerText = questions[currentIdx].exp; fb.style.display = 'block';
        if (idx === correct) {
            btn.classList.add('correct'); document.getElementById('sound-correct').play();
            score++; fb.style.color = 'green';
        } else {
            btn.classList.add('wrong'); allBtns[correct].classList.add('correct');
            document.getElementById('sound-wrong').play(); fb.style.color = 'red';
        }
        setTimeout(() => { currentIdx++; loadQuestion(); }, 3000);
    }

    function showFinal() {
        document.getElementById('quiz-ui').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('final-score').innerText = `${score} / ${questions.length}`;
        document.getElementById('congrats-msg').innerText = `أحسنت يا ${userName}!`;
        let msg = score >= 7 ? "مستوى ممتاز، أنت جاهز لحماية مزرعتك." : "راجع المحاضرة لتقوية معلوماتك.";
        document.getElementById('evaluation-text').innerText = msg;
    }

    function sendWhatsApp() {
        const phone = "249999240574";
        const message = `السلام عليكم م. محمد طه،\nأنا المتدرب: ${userName}\nلقد أكملت إختبار المحاضرة الرابعة بنجاح.\nالنتيجة: ${score} من 10\nأرغب في استخراج الشهادة المعتمدة (رسوم: 7000 جنيه).`;
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
    }
</script>
</body>
</html>
